name: Test PR Branch Name - Token Required
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Assert action ran with valid token (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BRANCH: ${{ steps.action.outputs.current-branch }}
        run: |
          echo "outcome: $OUTCOME"
          echo "branch: $BRANCH"
          # Under act, the sentinel repo means any PR-lookup API call will 404.
          # The action either succeeds (if it can resolve the branch) or fails
          # gracefully. Both are acceptable outcomes — what matters is it ran.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with output '$BRANCH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / non-PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
