name: Test PR Branch Name - basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert action ran (outputs set, or failed gracefully without PR context)
        env:
          BRANCH: ${{ steps.action.outputs.current-branch }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "branch: $BRANCH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BRANCH" ]; then
              echo "FAIL: action succeeded but current-branch output is empty"
              exit 1
            fi
            echo "PASS: got branch '$BRANCH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR context available under workflow_dispatch)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
