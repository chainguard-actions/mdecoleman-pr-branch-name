name: Test PR event with invalid token fails at API call
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Write a fake GitHub event payload with a pull_request object
      - name: Create fake pull_request event payload
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 42,
              "head": {
                "ref": "feature-branch"
              },
              "base": {
                "ref": "main"
              }
            },
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-event/event.json" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: fake-invalid-token

      - name: Assert action failed at API call (not at payload parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid (API call fails),
          # but it should NOT fail with "Could not get pull request number from context"
          # which would indicate it didn't read the PR payload correctly.
          # Either failure (API error) is acceptable here — we just verify it ran past
          # the payload parsing stage by checking it attempted the API call.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly attempted API call and failed with invalid token"
