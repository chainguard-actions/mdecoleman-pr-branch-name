name: Test PR Branch Name - Basic Usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert repo-token input was accepted
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "Action conclusion: ${{ steps.action.conclusion }}"
          # The action requires a real GitHub API call to get the PR branch name.
          # In act (local), the API call may fail due to no real token/PR.
          # We verify the action was invoked (outcome is set) and the input was accepted.
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action did not run at all"
            exit 1
          fi
          echo "PASS: action ran with repo-token input provided"
