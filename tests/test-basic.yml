name: Test PR Branch Name - Basic Usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Assert action ran (output set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BRANCH: ${{ steps.action.outputs.current-branch }}
        run: |
          echo "outcome: $OUTCOME"
          echo "branch: $BRANCH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BRANCH" ]; then
              echo "FAIL: action succeeded but current-branch output is empty"
              exit 1
            fi
            echo "PASS: got branch '$BRANCH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or non-PR context is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
