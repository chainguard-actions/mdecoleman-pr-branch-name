name: Test PR Branch Name - No PR Context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect failure - no PR context under workflow_dispatch)
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed gracefully with no PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BRANCH: ${{ steps.action.outputs.branch }}
        run: |
          echo "outcome: $OUTCOME"
          echo "branch output: $BRANCH"
          # Under workflow_dispatch there is no pull_request payload,
          # so the action should call setFailed and the step should fail.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no PR context)"
          elif [ "$OUTCOME" = "success" ]; then
            # Unexpected success — only valid if a branch was actually returned
            if [ -n "$BRANCH" ]; then
              echo "PASS: action succeeded and returned branch '$BRANCH'"
            else
              echo "FAIL: action succeeded but returned no branch output"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
