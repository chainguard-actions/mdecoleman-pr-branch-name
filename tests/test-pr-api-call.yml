name: Test PR Branch Name - PR API Call
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Simulate pull_request payload in event file
        run: |
          # Create a fake pull_request event payload so the action can extract a PR number.
          # The action reads github.context.payload.pull_request.number from the event file.
          mkdir -p /tmp/act-event
          cat > /tmp/act-event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 1,
              "head": {
                "ref": "feature/test-branch"
              }
            }
          }
          EOF
          # Overwrite the GitHub event file so the action picks up the PR payload.
          if [ -n "$GITHUB_EVENT_PATH" ]; then
            cp /tmp/act-event/event.json "$GITHUB_EVENT_PATH"
            echo "Wrote PR payload to $GITHUB_EVENT_PATH"
          else
            echo "GITHUB_EVENT_PATH not set, skipping event file override"
          fi

      - name: Run action with PR payload (may fail on sentinel repo)
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran and handled result gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BRANCH: ${{ steps.action.outputs.branch }}
        run: |
          echo "outcome: $OUTCOME"
          echo "branch output: $BRANCH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$BRANCH" ]; then
              echo "PASS: action succeeded and returned branch '$BRANCH'"
            else
              echo "FAIL: action succeeded but returned no branch output"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            # Expected: sentinel GITHUB_REPOSITORY causes the pulls.get API call to 404,
            # or the PR number was still not found in the context.
            echo "PASS: action failed gracefully (sentinel repo or no PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
