name: Test PR Branch Name - Pull Request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with repo-token input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "Branch output: ${{ steps.action.outputs.branch }}"
          # The action may fail in act due to no real GitHub API, but it must
          # at least be invoked with the repo-token input provided.
          # We verify the step was reached (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with repo-token input"
