name: Test PR Branch Name - pull request context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with repo-token input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "Action conclusion: ${{ steps.action.conclusion }}"
          # The action may fail in act due to no real GitHub API, but the input must be accepted
          # We verify the step was attempted (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with repo-token input provided"
