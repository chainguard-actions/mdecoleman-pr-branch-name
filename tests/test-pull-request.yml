name: Test PR Branch Name - pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert repo-token input was accepted
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail in act due to no real GitHub API, but it must
          # have been invoked (not skipped due to missing required input).
          # A 'skipped' outcome would indicate the input was not provided.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, repo-token input may not have been passed"
            exit 1
          fi
          echo "PASS: action was invoked with repo-token input"
