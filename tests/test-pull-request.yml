name: Test PR Branch Name - pull request event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with repo-token input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "Action conclusion: ${{ steps.action.conclusion }}"
          # The action requires a real GitHub token and PR context to succeed.
          # In act, the token may not have API access to a real PR, so we
          # accept either success or failure — the key requirement is that
          # the repo-token input is passed and the action is invoked.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with repo-token input"
