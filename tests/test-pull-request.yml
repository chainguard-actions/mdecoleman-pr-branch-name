name: Test PR Branch Name - pull request scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action was invoked with repo-token input
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          echo "Branch output: ${{ steps.action.outputs.branch }}"
          # In act local environment, the action may not be able to reach GitHub API
          # but it should have been invoked with the repo-token input correctly.
          # We verify the step ran (not skipped) and accept success or failure from API call.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with repo-token input"
